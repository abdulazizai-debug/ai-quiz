<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ماهو مستواك في الذكاء الاصطناعي؟</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Brand page: always dark, same palette as the channel's posts */
:root{
  --bg:#0E1116; --surface:#141922; --surface2:#11161D; --line:#1B222C; --grid:rgba(34,230,192,.07);
  --accent:#22E6C0; --accent-soft:rgba(34,230,192,.10); --accent-line:rgba(34,230,192,.38);
  --amber:#F5B400; --amber-ink:#0E1116; --amber-soft:rgba(245,180,0,.12);
  --text:#F4F4F2; --muted:#8B95A1; --danger:#FF7A6B; --ring-track:#1F2732;
  color-scheme:dark;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --bg:#0E1116; --text:#F4F4F2; } }
:root[data-theme="dark"]{ --bg:#0E1116; --text:#F4F4F2; }
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{
  min-height:100%;color:var(--text);background-color:var(--bg);
  background-image:
    linear-gradient(to bottom, transparent 55%, var(--bg) 100%),
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size:100% 100%, 56px 56px, 56px 56px;
  background-attachment:fixed;
  font-family:'IBM Plex Sans Arabic','Segoe UI',Tahoma,sans-serif;
  line-height:1.75;letter-spacing:0;-webkit-font-smoothing:antialiased;overflow-x:hidden;
}
button,input{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:12px}

/* hero vortex */
#vortex{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none;transition:opacity .6s}
.glow{position:fixed;inset:0;z-index:0;pointer-events:none;transition:opacity .6s;
  background:radial-gradient(circle at var(--gx,30%) var(--gy,50%), rgba(34,230,192,.14), transparent 40%),linear-gradient(to left, rgba(14,17,22,.92) 0%, rgba(14,17,22,.7) 38%, rgba(14,17,22,0) 62%)}
/* privacy modal */
.modal{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(6,8,11,.78);backdrop-filter:blur(6px)}
.modal[hidden]{display:none}
.modal-card{width:100%;max-width:560px;max-height:85vh;overflow:auto;background:var(--surface);border:1px solid var(--accent-line);border-radius:20px;padding:24px;box-shadow:0 0 40px -12px rgba(34,230,192,.35);animation:enter .25s ease}
.modal-card h2{font-size:19px;font-weight:700;line-height:1.5}
.modal-card ol{margin-top:16px;padding-inline-start:22px;display:grid;gap:10px;font-size:15px;line-height:1.85;color:#C9D0D8}
.modal-card ol li::marker{color:var(--accent);font-weight:700}
.modal-card a{color:var(--accent)}
.modal-close{margin-top:20px;width:100%;padding:12px;border-radius:12px;border:1px solid var(--accent-line);color:var(--accent);font-weight:700}
.modal-close:hover{background:var(--accent-soft)}
@media (max-width:820px){.glow{background:radial-gradient(circle at var(--gx,50%) var(--gy,30%), rgba(34,230,192,.14), transparent 45%),linear-gradient(to bottom, rgba(14,17,22,0) 20%, rgba(14,17,22,.85) 48%)}}
body.quiz #vortex,body.quiz .glow{opacity:0}

.app{position:relative;z-index:1;max-width:1120px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;padding:18px 20px 28px}
.top{display:flex;align-items:center;justify-content:space-between;min-height:44px;max-width:560px;width:100%;margin:0 auto}
body.landing .top{max-width:none}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:15px}
.brand i{width:9px;height:9px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 4px var(--accent-soft),0 0 14px var(--accent)}
.brand span{direction:ltr}
.back{display:none;align-items:center;gap:6px;font-size:14px;font-weight:600;color:var(--muted);padding:8px 4px}
.back.show{display:inline-flex}
.back svg{width:16px;height:16px}

.progress{display:none;margin:14px auto 0;max-width:560px;width:100%}
.progress.show{display:block}
.segs{display:flex;gap:6px}
.seg{flex:1;height:4px;border-radius:4px;background:var(--line);overflow:hidden}
.seg b{display:block;height:100%;width:0;background:var(--accent);box-shadow:0 0 10px var(--accent);transition:width .35s ease}
.progmeta{display:flex;justify-content:space-between;margin-top:10px;font-size:13px;color:var(--muted);font-weight:500}
.progmeta strong{color:var(--text);font-weight:600}

main{flex:1;display:flex;flex-direction:column;justify-content:center;padding:26px 0 8px}
.narrow{max-width:560px;width:100%;margin:0 auto}
.screen{animation:enter .38s cubic-bezier(.2,.7,.2,1)}
@keyframes enter{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* landing */
.hero{display:flex;flex-direction:column;justify-content:center;gap:34px;min-height:calc(100vh - 120px);max-width:660px}
.kicker{display:flex;align-items:center;gap:12px;font-size:14px;font-weight:600;color:var(--accent)}
.kicker::before{content:"";width:34px;height:1px;background:var(--accent-line)}
.hero h1{margin-top:18px;font-size:clamp(36px,6.4vw,72px);line-height:1.25;font-weight:700;max-width:13em}
.hero h1 .lit{color:var(--accent);text-shadow:0 0 28px rgba(34,230,192,.55),0 0 2px rgba(34,230,192,.8)}
.hero p{margin-top:20px;color:#AEB6C0;font-size:clamp(16px,2vw,18px);max-width:34em;line-height:1.9}
.start{
  margin-top:32px;display:inline-flex;align-items:center;gap:12px;text-align:start;
  border:1px solid var(--accent-line);background:rgba(14,17,22,.55);backdrop-filter:blur(6px);
  color:var(--accent);font-weight:700;font-size:17px;line-height:1.6;padding:15px 22px;border-radius:12px;
  box-shadow:0 0 0 0 rgba(34,230,192,0),inset 0 0 18px rgba(34,230,192,.06);
  transition:box-shadow .25s,background .25s,transform .15s;
}
.start:hover{background:rgba(34,230,192,.10);box-shadow:0 0 28px rgba(34,230,192,.28),inset 0 0 18px rgba(34,230,192,.10)}
.start:active{transform:scale(.99)}
.start svg{width:20px;height:20px;flex-shrink:0;transform:scaleX(-1)}
.stats{display:flex;gap:0;border-top:1px solid var(--line);padding-top:20px}
.stats .stat{padding-inline:0 28px;margin-inline-end:28px;border-inline-end:1px solid var(--line)}
.stats .stat:last-child{border:0;margin:0;padding:0}
.stats .live{display:none}
.stats .live i{width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 8px var(--accent);animation:blink 2s ease-in-out infinite}
@keyframes blink{50%{opacity:.35}}
.stat small{display:block;font-size:13px;color:var(--muted);font-weight:500}
.stat b{display:block;font-size:28px;font-weight:700;line-height:1.3}

/* question */
.qnum{font-size:14px;color:var(--accent);font-weight:600}
.q h2{font-size:clamp(22px,6vw,28px);line-height:1.6;font-weight:700;margin-top:6px}
.q .hint{margin-top:6px;font-size:14px;color:var(--muted)}
.opts{margin-top:26px;display:grid;gap:10px}
.opt{
  display:flex;align-items:center;gap:14px;width:100%;text-align:start;
  background:rgba(20,25,34,.88);border:1px solid var(--line);border-radius:16px;
  padding:15px 16px;font-size:16px;font-weight:500;line-height:1.6;
  transition:border-color .18s,background .18s,box-shadow .18s;
}
.opt:hover{border-color:var(--accent-line)}
.opt .key{
  width:30px;height:30px;border-radius:9px;flex-shrink:0;display:grid;place-items:center;
  font-size:14px;font-weight:700;color:var(--muted);border:1px solid var(--line);background:var(--surface2);transition:all .18s;
}
.opt.sel{border-color:var(--accent);background:rgba(34,230,192,.09);box-shadow:0 0 18px rgba(34,230,192,.12)}
.opt.sel .key{background:var(--accent);border-color:var(--accent);color:var(--bg)}
.opt .box{width:22px;height:22px;border-radius:6px;border:1.5px solid var(--muted);flex-shrink:0;display:grid;place-items:center;transition:all .18s}
.opt .box svg{width:13px;height:13px;opacity:0;color:var(--bg)}
.opt.sel .box{background:var(--accent);border-color:var(--accent)}
.opt.sel .box svg{opacity:1}
.next-btn{margin-top:18px;width:100%;padding:14px;border-radius:14px;font-weight:700;font-size:16px;background:var(--accent);color:var(--bg);transition:opacity .2s}
.next-btn[disabled]{opacity:.35;cursor:not-allowed}

/* prompt comparison */
.duel{margin-top:24px;display:grid;gap:10px}
.bubble{width:100%;text-align:start;background:rgba(20,25,34,.88);border:1px solid var(--line);border-radius:18px;padding:14px 18px 16px;transition:border-color .18s,background .18s,box-shadow .18s}
.bubble:hover{border-color:var(--accent-line)}
.bubble .who{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--muted)}
.bubble .who i{width:22px;height:22px;border-radius:7px;display:grid;place-items:center;background:var(--surface2);border:1px solid var(--line);font-style:normal;font-size:12px}
.bubble .txt{margin-top:8px;font-size:15.5px;line-height:1.85;font-weight:500}
.bubble .cursor{display:inline-block;width:2px;height:1.05em;background:var(--accent);vertical-align:-2px;margin-inline-start:3px;opacity:.7}
.bubble.sel{border-color:var(--accent);background:rgba(34,230,192,.09);box-shadow:0 0 18px rgba(34,230,192,.12)}
.bubble.sel .who i{background:var(--accent);border-color:var(--accent);color:var(--bg)}

/* analyzing */
.analyze h2{font-size:24px;font-weight:700}
.steps{margin-top:26px;display:grid;gap:16px}
.step{display:flex;align-items:center;gap:12px;font-size:16px;color:var(--muted);transition:color .3s}
.step .dot{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;flex-shrink:0;transition:all .3s}
.step .dot svg{width:13px;height:13px;opacity:0;transition:opacity .2s}
.step.on{color:var(--text)}
.step.on .dot{border-color:var(--accent);animation:pulse 1s ease-in-out infinite}
.step.done{color:var(--text)}
.step.done .dot{background:var(--accent);border-color:var(--accent);animation:none}
.step.done .dot svg{opacity:1;color:var(--bg)}
@keyframes pulse{50%{box-shadow:0 0 0 6px var(--accent-soft)}}

/* result */
.res-head{display:grid;grid-template-columns:auto 1fr;gap:20px;align-items:center}
.ring{position:relative;width:132px;height:132px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg);filter:drop-shadow(0 0 8px rgba(34,230,192,.35))}
.ring .num{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.ring .num b{font-size:40px;font-weight:700;line-height:1;direction:ltr}
.ring .num small{display:block;font-size:12px;color:var(--muted);margin-top:4px}
.lvl-pill{display:inline-block;font-size:13px;font-weight:700;color:var(--amber-ink);background:var(--amber);padding:2px 12px;border-radius:20px}
.res-head h2{font-size:24px;line-height:1.45;font-weight:700;margin-top:8px}
.res-head p{font-size:14px;color:var(--muted);margin-top:4px;line-height:1.7}
.ladder{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:26px}
.rung{border-top:3px solid var(--line);padding-top:8px;font-size:13px;color:var(--muted);font-weight:500}
.rung.past{border-color:var(--accent-line)}
.rung.now{border-color:var(--accent);color:var(--text);font-weight:700;box-shadow:0 -6px 14px -8px var(--accent)}
.block{margin-top:30px}
.block h3{font-size:17px;font-weight:700}
.block .sub{font-size:14px;color:var(--muted);margin-top:2px}
.radar-wrap{margin-top:14px;background:rgba(20,25,34,.88);border:1px solid var(--line);border-radius:20px;padding:10px 6px}
.radar{display:block;width:100%;max-width:400px;margin:0 auto;height:auto;overflow:visible}
.radar text{font-family:inherit;font-size:12.5px;font-weight:600;fill:var(--muted)}
.radar .val{fill:var(--text);font-weight:700}
.radar .shape{fill:rgba(34,230,192,.12);stroke:var(--accent);stroke-width:2;stroke-linejoin:round}
.radar .grid{fill:none;stroke:var(--line);stroke-width:1}
.areas{margin-top:14px;display:grid;gap:10px}
.area{background:rgba(20,25,34,.88);border:1px solid var(--line);border-radius:16px;padding:14px 16px}
.area .row{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.area .name{font-weight:700;font-size:15px}
.area .pct{font-weight:700;font-size:15px;direction:ltr}
.bar{height:6px;border-radius:6px;background:var(--line);margin-top:8px;overflow:hidden}
.bar b{display:block;height:100%;width:0;border-radius:6px;background:var(--accent);transition:width 1s cubic-bezier(.2,.7,.2,1)}
.area.weak .bar b{background:var(--amber)}
.area p{font-size:14px;color:var(--muted);margin-top:8px;line-height:1.7}
.next{margin-top:14px;display:grid;gap:10px;counter-reset:n}
.next li{list-style:none;display:flex;gap:12px;align-items:flex-start;font-size:15px;line-height:1.7}
.next li::before{counter-increment:n;content:counter(n);flex-shrink:0;width:26px;height:26px;border-radius:8px;display:grid;place-items:center;font-size:13px;font-weight:700;background:var(--accent-soft);color:var(--accent);margin-top:1px}
.send{margin-top:30px;background:rgba(20,25,34,.92);border:1px solid var(--accent-line);border-radius:20px;padding:20px;box-shadow:0 0 30px -12px rgba(34,230,192,.35)}
.send h3{font-size:18px;font-weight:700}
.send .sub{font-size:14px;color:var(--muted);margin-top:4px}
.field{margin-top:14px}
.field label{display:block;font-size:13px;font-weight:600;margin-bottom:6px}
.field input{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:16px;transition:border-color .2s}
.field input[type=email]{direction:ltr;text-align:right}
.field input:focus{outline:none;border-color:var(--accent)}
.field.err input{border-color:var(--danger)}
.msg{font-size:13px;color:var(--danger);margin-top:6px;display:none}
.field.err .msg{display:block}
.consent{display:flex;gap:10px;align-items:flex-start;margin-top:14px;font-size:13.5px;color:var(--muted);line-height:1.7}
.consent input{margin-top:5px;width:18px;height:18px;accent-color:var(--accent);flex-shrink:0}
.consent a{color:var(--accent)}
.consent.err{color:var(--danger)}
.cta{margin-top:16px;width:100%;background:var(--amber);color:var(--amber-ink);font-weight:700;font-size:17px;border-radius:14px;padding:14px;transition:transform .15s,filter .15s}
.cta:hover{filter:brightness(1.05)}
.cta:active{transform:scale(.99)}
.sent{display:none;text-align:center;padding:10px 0}
.sent.show{display:block}
.sent .ok{width:52px;height:52px;border-radius:50%;background:var(--accent);color:var(--bg);display:grid;place-items:center;margin:0 auto;box-shadow:0 0 22px rgba(34,230,192,.45)}
.sent .ok svg{width:24px;height:24px}
.sent h3{margin-top:12px}
.sent p{font-size:14px;color:var(--muted);margin-top:4px}
.again{display:block;margin:30px auto 0;font-size:14px;font-weight:600;color:var(--muted);text-decoration:underline;text-underline-offset:4px}
.proto{margin-top:18px;text-align:center;font-size:12px;color:var(--muted)}

@media (max-width:820px){
  .hero{min-height:calc(100vh - 110px);justify-content:flex-end;padding-bottom:10px}
  .stats .stat{padding-inline:0 18px;margin-inline-end:18px}
  .stat b{font-size:22px}
  .start{width:100%;justify-content:space-between}
}
@media (max-width:380px){ .res-head{grid-template-columns:1fr;justify-items:start} }
@media (prefers-reduced-motion: reduce){ *,*::before,*::after{animation:none!important;transition:none!important} }
</style>
</head>
<body class="landing">
<canvas id="vortex" aria-hidden="true"></canvas>
<div class="glow" id="glow" aria-hidden="true"></div>
<div class="app">
  <header class="top">
    <div class="brand"><i></i><span>AI Analytics</span></div>
    <button class="back" id="back" aria-label="السؤال السابق">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 6 15 12 9 18"/></svg>
      رجوع
    </button>
  </header>
  <div class="progress" id="progress">
    <div class="segs" id="segs"></div>
    <div class="progmeta"><strong id="secName"></strong><span id="count"></span></div>
  </div>
  <main id="main" aria-live="polite"></main>
</div>
<div class="modal" id="policy" role="dialog" aria-modal="true" aria-labelledby="policyTitle" hidden>
  <div class="modal-card">
    <h2 id="policyTitle"></h2>
    <ol id="policyList"></ol>
    <button class="modal-close" id="policyClose"></button>
  </div>
</div>

<script>
/* =========================================================
   المحتوى — عدّل النصوص هنا بدون ما تلمس باقي الكود
   w = الوزن (1 عادي، 2 ضعف). p = النقاط من 0 إلى 3
   ========================================================= */
const TEXT = {
  kicker:'اختبار مهارات الذكاء الاصطناعي',
  headline:['ماهو مستواك الحقيقي في', 'الذكاء الاصطناعي؟'],
  intro:'الذكاء الاصطناعي صار جزء من طريقة عملنا. الفرق الحقيقي مو إنك تستخدمه، الفرق إنك توجّهه: تربطه ببياناتك وأدواتك، وتخليه ينجز معك مهام كاملة بدل ما تكلمه رسالة رسالة. اختبار قصير يوريك وين أنت اليوم، ووش خطوتك الجاية للمستوى المتقدم.',
  start:'ابدأ الاختبار القصير لتقييم مهاراتك في الذكاء الاصطناعي',
  stats:[['سؤال','17'],['دقايق تقريباً','5'],['مهارات','4']],
  firstHint:'نبدأ بسؤال سريع عنك عشان نفهم نتيجتك.',
  multiHint:'اختر كل اللي ينطبق',
  nextBtn:'التالي',
  duelLabel:'أي طلب أفضل؟',
  analyzeTitle:'لحظات ونجهّز نتيجتك',
  analyzeSteps:['نقرأ إجاباتك','نحسب مستواك في 4 مهارات','نجهّز تقريرك'],
  skillsTitle:'مهاراتك الأربع', skillsSub:'وين أنت قوي، ووين تقدر تتحسن', nextTitle:'خطوتك الجاية',
  formTitle:'حمّل دليلك المجاني لإتقان الذكاء الاصطناعي',
  formSub:'دليل عملي يطوّر المهارات الأربع اللي قسناها، مع طلبات جاهزة تستخدمها من اليوم. يوصلك على إيميلك.',
  nameLabel:'الاسم', nameError:'اكتب اسمك.', emailLabel:'الإيميل', emailError:'اكتب إيميل صحيح عشان نرسل لك الدليل.',
  consent:'أوافق على استخدام إيميلي لإرسال الدليل ومحتوى تعليمي عن الذكاء الاصطناعي، حسب <a href="#" class="policy-link">سياسة الخصوصية</a>. أقدر ألغي الاشتراك متى ما بغيت.',
  formBtn:'أرسل لي الدليل', sentTitle:'تم، الدليل في طريقه لإيميلك', sentNote:'النسخة التجريبية ما ترسل إيميلات فعلياً.',
  restart:'أعد الاختبار'
};

const POLICY = {
  title:'سياسة الخصوصية — Abdulaziz AI | Analytics',
  items:[
    'نجمع اسمك وبريدك الإلكتروني ونتيجة اختبارك فقط، ولا نجمع أي بيانات حساسة.',
    'نستخدم بياناتك لإرسال الدليل المجاني، ومحتوى تعليمي في مجال الذكاء الاصطناعي وتحليل البيانات، ومعلومات عن دوراتنا التدريبية.',

const KEYS = ['أ','ب','ج','د','هـ'];
const $ = s => document.querySelector(s);
const main = $('#main');
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
let idx = -1, answers = {}, order = {};

const ico = {
  arrow:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="13 6 19 12 13 18"/></svg>',
  check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>'
};

function shuffled(q, i){
  if(order[i]) return order[i];
  let opts = q.options.map((o,k)=>({...o,k}));
  if(q.type!=='multi'){
    const fixed = opts.filter(o=>o.fixed), rest = opts.filter(o=>!o.fixed);
    for(let j=rest.length-1;j>0;j--){const r=Math.floor(Math.random()*(j+1));[rest[j],rest[r]]=[rest[r],rest[j]]}
    opts = [...rest, ...fixed];
  }
  return order[i] = opts;
}

function buildSegs(){ $('#segs').innerHTML = SECTIONS.map(s=>`<div class="seg" data-s="${s.id}"><b></b></div>`).join(''); }
function updateProgress(){
  const show = idx>=0 && idx<QUESTIONS.length;
  $('#progress').classList.toggle('show', show);
  $('#back').classList.toggle('show', show);
  if(!show) return;
  const q = QUESTIONS[idx];
  SECTIONS.forEach(s=>{
    const qs = QUESTIONS.map((x,i)=>({x,i})).filter(o=>o.x.sec===s.id);
    const done = qs.filter(o=>o.i<idx).length;
    document.querySelector(`.seg[data-s="${s.id}"] b`).style.width = (done/qs.length*100)+'%';
  });
  $('#secName').textContent = SECTIONS.find(s=>s.id===q.sec).name;
  $('#count').textContent = `${idx+1} من ${QUESTIONS.length}`;
}
function swap(html, wide){
  main.innerHTML = `<div class="screen ${wide?'':'narrow'}">${html}</div>`;
  window.scrollTo({top:0});
  updateProgress();
}
function setMode(landing){
  document.body.classList.toggle('landing', landing);
  document.body.classList.toggle('quiz', !landing);
  landing ? Vortex.start() : Vortex.stop();
}

function landing(){
  idx = -1; setMode(true);
  swap(`<section class="hero">
    <div>
      <div class="kicker">${TEXT.kicker}</div>
      <h1>${TEXT.headline[0]} <span class="lit">${TEXT.headline[1]}</span></h1>
      <p>${TEXT.intro}</p>
      <button class="start" id="startBtn"><span>${TEXT.start}</span>${ico.arrow}</button>
    </div>
    <aside class="stats" aria-label="عن الاختبار">
      <div class="live"><i></i>عن الاختبار</div>
      ${TEXT.stats.map(([l,v])=>`<div class="stat"><small>${l}</small><b>${v}</b></div>`).join('')}
    </aside>
  </section>`, true);
  $('#startBtn').onclick = ()=>{ idx=0; setMode(false); renderQ(); };
}

function renderQ(){
  const q = QUESTIONS[idx], opts = shuffled(q, idx), chosen = answers[idx];
  if(q.type==='duel'){
    swap(`<section class="q"><div class="qnum">${TEXT.duelLabel}</div><h2>${q.text}</h2>
      <div class="duel">${opts.map((o,n)=>`
        <button class="bubble ${chosen===o.k?'sel':''}" data-k="${o.k}">
          <span class="who"><i>${KEYS[n]}</i>الطلب ${KEYS[n]}</span>
          <div class="txt">«${o.t}»<span class="cursor"></span></div>
        </button>`).join('')}</div></section>`);
    main.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>pick(+b.dataset.k,b));
  } else if(q.type==='multi'){
    const set = new Set(chosen||[]);
    swap(`<section class="q"><div class="qnum">سؤال ${idx+1}</div><h2>${q.text}</h2>
      ${idx===0?`<p class="hint">${TEXT.firstHint} ${TEXT.multiHint}.</p>`:`<p class="hint">${TEXT.multiHint}.</p>`}
      <div class="opts">${opts.map(o=>`<button class="opt ${set.has(o.k)?'sel':''}" data-k="${o.k}" aria-pressed="${set.has(o.k)}"><span class="box">${ico.check}</span><span>${o.t}</span></button>`).join('')}</div>
      <button class="next-btn" id="nextBtn" ${set.size?'':'disabled'}>${TEXT.nextBtn}</button></section>`);
    main.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{
      const k=+b.dataset.k; set.has(k)?set.delete(k):set.add(k);
      b.classList.toggle('sel'); b.setAttribute('aria-pressed', set.has(k));
      answers[idx]=[...set]; $('#nextBtn').disabled = !set.size;
    });
    $('#nextBtn').onclick=()=>{ idx++; renderQ(); };
  } else {
    swap(`<section class="q"><div class="qnum">سؤال ${idx+1}</div><h2>${q.text}</h2>
      <div class="opts">${opts.map((o,n)=>`<button class="opt ${chosen===o.k?'sel':''}" data-k="${o.k}"><span class="key">${KEYS[n]}</span><span>${o.t}</span></button>`).join('')}</div></section>`);
    main.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>pick(+b.dataset.k,b));
  }
}

let locked=false;
function pick(k, el){
  if(locked) return; locked=true;
  answers[idx]=k;
  main.querySelectorAll('[data-k]').forEach(b=>b.classList.remove('sel'));
  el.classList.add('sel');
  setTimeout(()=>{ locked=false; if(idx<QUESTIONS.length-1){ idx++; renderQ(); } else analyzing(); }, reduce?60:280);
}

$('#back').onclick = ()=>{ if(idx>0){ idx--; renderQ(); } else landing(); };
document.addEventListener('keydown', e=>{
  if(idx<0||idx>=QUESTIONS.length) return;
  const n = parseInt(e.key,10);
  if(n>=1){ const b = main.querySelectorAll('[data-k]')[n-1]; if(b) b.click(); }
});

function analyzing(){
  idx = QUESTIONS.length;
  swap(`<section class="analyze"><h2>${TEXT.analyzeTitle}</h2>
    <div class="steps">${TEXT.analyzeSteps.map((l,i)=>`<div class="step" id="st${i}"><span class="dot">${ico.check}</span>${l}</div>`).join('')}</div></section>`);
  const t = reduce?150:850, n = TEXT.analyzeSteps.length;
  for(let i=0;i<n;i++){
    setTimeout(()=>$('#st'+i).classList.add('on'), i*t);
    setTimeout(()=>{$('#st'+i).classList.remove('on');$('#st'+i).classList.add('done')}, i*t+t-120);
  }
  setTimeout(result, n*t+250);
}

function scores(){
  const out={};
  Object.keys(AREAS).forEach(a=>{
    let s=0,m=0;
    QUESTIONS.forEach((q,i)=>{ if(q.area===a){ const w=q.w||1; m+=3*w; const k=answers[i]; if(k!=null) s+=(q.options[k].p||0)*w; } });
    out[a]=m?Math.round(s/m*100):0;
  });
  let tw=0,tot=0; Object.keys(out).forEach(a=>{const w=AREAS[a].w||1; tw+=w; tot+=out[a]*w;});
  return {areas:out, overall:Math.round(tot/tw)};
}
const band = v => v<40?'low':v<70?'mid':'high';

function radarSVG(a){
  const keys=Object.keys(AREAS), cx=200, cy=150, R=92;
  const ang=[-90,0,90,180].map(d=>d*Math.PI/180);
  const pt=(i,r)=>[cx+Math.cos(ang[i])*r, cy+Math.sin(ang[i])*r];
  const grid=[.33,.66,1].map(f=>`<polygon class="grid" points="${ang.map((_,i)=>pt(i,R*f).join(',')).join(' ')}"/>`).join('');
  const axes=ang.map((_,i)=>{const [x,y]=pt(i,R);return `<line class="grid" x1="${cx}" y1="${cy}" x2="${x}" y2="${y}"/>`}).join('');
  const shape=keys.map((k,i)=>pt(i,Math.max(a[k],4)/100*R).join(',')).join(' ');
  const pos=[[cx,cy-R-30,'mid'],[cx+R+12,cy-4,'right'],[cx,cy+R+22,'mid'],[cx-R-12,cy-4,'left']];
  const anc=(side,dir)=> side==='mid'?'middle' : side==='right' ? (dir==='rtl'?'end':'start') : (dir==='rtl'?'start':'end');
  const labels=keys.map((k,i)=>{const [x,y,side]=pos[i];
    return `<text x="${x}" y="${y}" text-anchor="${anc(side,'rtl')}" direction="rtl">${AREAS[k].name}</text>
            <text class="val" x="${x}" y="${y+17}" text-anchor="${anc(side,'ltr')}" direction="ltr">${a[k]}%</text>`}).join('');
  const dots=keys.map((k,i)=>{const [x,y]=pt(i,Math.max(a[k],4)/100*R);return `<circle cx="${x}" cy="${y}" r="4" fill="var(--amber)"/>`}).join('');
  return `<svg class="radar" viewBox="0 0 400 300" role="img" aria-label="رسم مهاراتك الأربع">
    ${grid}${axes}<polygon class="shape" id="shape" points="${keys.map(()=>`${cx},${cy}`).join(' ')}" data-to="${shape}"/>${dots}${labels}</svg>`;
}

function result(){
  const {areas,overall}=scores();
  const L=[...LEVELS].reverse().find(l=>overall>=l.min), li=LEVELS.indexOf(L);
  const C=2*Math.PI*56;
  const weakest=Object.keys(areas).sort((x,y)=>areas[x]-areas[y])[0];
  swap(`<section class="res">
    <div class="res-head">
      <div class="ring">
        <svg viewBox="0 0 132 132"><circle cx="66" cy="66" r="56" fill="none" stroke="var(--ring-track)" stroke-width="10"/>
        <circle id="arc" cx="66" cy="66" r="56" fill="none" stroke="var(--accent)" stroke-width="10" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C}" style="transition:stroke-dashoffset 1.2s cubic-bezier(.2,.7,.2,1)"/></svg>
        <div class="num"><div><b id="score">0</b><small>من 100</small></div></div>
      </div>
      <div><span class="lvl-pill">مستوى ${L.name}</span><h2>${L.title}</h2><p>${L.desc}</p></div>
    </div>
    <div class="ladder">${LEVELS.map((l,i)=>`<div class="rung ${i<li?'past':i===li?'now':''}">${l.name}</div>`).join('')}</div>
    <div class="block"><h3>${TEXT.skillsTitle}</h3><p class="sub">${TEXT.skillsSub}</p>
      <div class="radar-wrap">${radarSVG(areas)}</div>
      <div class="areas">${Object.keys(AREAS).map(k=>`
        <div class="area ${k===weakest?'weak':''}"><div class="row"><span class="name">${AREAS[k].name}</span><span class="pct">${areas[k]}%</span></div>
        <div class="bar"><b data-w="${areas[k]}"></b></div><p>${AREAS[k][band(areas[k])]}</p></div>`).join('')}</div>
    </div>
    <div class="block"><h3>${TEXT.nextTitle}</h3><ol class="next">${L.next.map(n=>`<li>${n}</li>`).join('')}</ol></div>
    <div class="send">
      <div id="formWrap">
        <h3>${TEXT.formTitle}</h3><p class="sub">${TEXT.formSub}</p>
        <div class="field" id="fName"><label for="nm">${TEXT.nameLabel}</label><input id="nm" type="text" autocomplete="given-name" required><div class="msg">${TEXT.nameError}</div></div>
        <div class="field" id="fMail"><label for="em">${TEXT.emailLabel}</label><input id="em" type="email" inputmode="email" autocomplete="email" placeholder="name@example.com"><div class="msg">${TEXT.emailError}</div></div>
        <label class="consent" id="fOk"><input type="checkbox" id="ok"><span>${TEXT.consent}</span></label>
        <button class="cta" id="sendBtn">${TEXT.formBtn}</button>
      </div>
      <div class="sent" id="sent"><div class="ok">${ico.check}</div><h3>${TEXT.sentTitle}</h3><p>${TEXT.sentNote}</p></div>
    </div>
    <button class="again" id="again">${TEXT.restart}</button>
    <p class="proto">نسخة تجريبية للاختبار الداخلي</p>
  </section>`);

  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    $('#arc').style.strokeDashoffset = C*(1-overall/100);
    main.querySelectorAll('.bar b').forEach(b=>b.style.width=b.dataset.w+'%');
    const shape=$('#shape'), to=shape.dataset.to.split(' ').map(p=>p.split(',').map(Number));
    const dur=reduce?1:1100, t0=performance.now(), el=$('#score');
    (function step(t){
      const p=Math.min(1,(t-t0)/dur), e=1-Math.pow(1-p,3);
      shape.setAttribute('points', to.map(q=>[200+(q[0]-200)*e, 150+(q[1]-150)*e].join(',')).join(' '));
      el.textContent=Math.round(overall*e);
      if(p<1) requestAnimationFrame(step);
    })(t0);
  }));

  $('#again').onclick=()=>{answers={};order={};landing();};
  $('#sendBtn').onclick=()=>{
    const nm=$('#nm').value.trim(), em=$('#em').value.trim(), okBox=$('#ok').checked;
    const good=/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(em);
    $('#fName').classList.toggle('err',!nm);
    $('#fMail').classList.toggle('err',!good);
    $('#fOk').classList.toggle('err',!okBox);
    if(!nm){$('#nm').focus();return}
    if(!good){$('#em').focus();return}
    if(!okBox) return;
    $('#formWrap').style.display='none'; $('#sent').classList.add('show');
  };
}

/* =========================================================
   خلفية الدوامة (Vortex) في الصفحة الأولى
   ========================================================= */
const Vortex = (()=>{
  const cv=$('#vortex'), ctx=cv.getContext('2d'), glow=$('#glow');
  let W=0,H=0,dpr=1,cx=0,cy=0,base=0,raf=null,parts=[],running=false;
  function size(){
    dpr=Math.min(window.devicePixelRatio||1,2);
    W=innerWidth; H=innerHeight;
    cv.width=W*dpr; cv.height=H*dpr; ctx.setTransform(dpr,0,0,dpr,0,0);
    const narrow = W<820;
    cx = narrow ? W*0.5 : W*0.24;     // RTL: text on the right, vortex on the left
    cy = narrow ? H*0.3 : H*0.5;
    base = Math.max(W,H)*(narrow?0.42:0.38);
    glow.style.setProperty('--gx', (cx/W*100)+'%'); glow.style.setProperty('--gy', (cy/H*100)+'%');
  }
  function seed(){
    const n = W<820 ? 380 : 700;
    parts = Array.from({length:n},()=>({a:Math.random()*Math.PI*2, z:Math.random(), r:.55+Math.random()*.9, s:.0004+Math.random()*.0006}));
  }
  function draw(advance){
    ctx.globalCompositeOperation='destination-out';
    ctx.fillStyle = advance ? 'rgba(0,0,0,.22)' : 'rgba(0,0,0,1)';
    ctx.fillRect(0,0,W,H);
    ctx.globalCompositeOperation='lighter';
    for(const p of parts){
      if(advance){ p.z -= p.s; p.a += .0009/(p.z+.1); if(p.z<=.02){ p.z=1; p.a=Math.random()*Math.PI*2; } }
      const rad = base*p.r*(.08/(p.z+.04));
      const x = cx + Math.cos(p.a)*rad, y = cy + Math.sin(p.a)*rad*.86;
      if(x<-20||x>W+20||y<-20||y>H+20) continue;
      const near = 1-p.z;
      const alpha = Math.min(.75, .04 + near*near*.8);
      const sz = .5 + near*1.9;
      ctx.fillStyle = `rgba(34,230,192,${alpha})`;
      ctx.beginPath(); ctx.arc(x,y,sz,0,Math.PI*2); ctx.fill();
    }
    // dark core
    ctx.globalCompositeOperation='source-over';
    const g = ctx.createRadialGradient(cx,cy,0,cx,cy,base*.09);
    g.addColorStop(0,'rgba(14,17,22,.9)'); g.addColorStop(1,'rgba(14,17,22,0)');
    ctx.fillStyle=g; ctx.beginPath(); ctx.arc(cx,cy,base*.09,0,Math.PI*2); ctx.fill();
  }
  function loop(){ draw(true); raf=requestAnimationFrame(loop); }
  function start(){
    if(running) return; running=true;
    size(); seed();
    if(reduce){ for(let i=0;i<60;i++) parts.forEach(p=>{p.z-=p.s*8; if(p.z<=.02)p.z=1}); draw(false); return; }
    loop();
  }
  function stop(){ running=false; if(raf) cancelAnimationFrame(raf); raf=null; }
  addEventListener('resize',()=>{ if(running){ size(); if(reduce) draw(false);} });
  document.addEventListener('visibilitychange',()=>{ if(document.hidden){ if(raf){cancelAnimationFrame(raf);raf=null;} } else if(running && !reduce && !raf){ loop(); } });
  return {start,stop};
})();

/* نافذة سياسة الخصوصية */
(function(){
  const m=$('#policy'); let last=null;
  $('#policyTitle').textContent=POLICY.title;
  $('#policyList').innerHTML=POLICY.items.map(i=>`<li>${i}</li>`).join('');
  $('#policyClose').textContent=POLICY.close;
  const close=()=>{ m.hidden=true; if(last) last.focus(); };
  document.addEventListener('click',e=>{
    const a=e.target.closest('.policy-link'); if(!a) return;
    e.preventDefault(); last=a; m.hidden=false; m.querySelector('.modal-card').scrollTop=0; $('#policyClose').focus({preventScroll:true});
  });
  $('#policyClose').onclick=close;
  m.addEventListener('click',e=>{ if(e.target===m) close(); });
  document.addEventListener('keydown',e=>{ if(e.key==='Escape' && !m.hidden) close(); });
})();

buildSegs();
landing();
